name: Compteurs Maps

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collecte Maps agences"]
    types: [completed]

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compteurs (agences, doublons, sites web)
        run: python stats_maps.py maps
