name: Compteurs Maps

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collecte Maps agences"]
    types: [completed]

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compteurs (agences, doublons, sites web, réseaux, catégories)
        run: python stats_maps.py maps

      - name: Liste complète des catégories (maps_categories.csv)
        uses: actions/upload-artifact@v4
        with:
          name: maps-categories
          path: maps_categories.csv
          retention-days: 14
          
